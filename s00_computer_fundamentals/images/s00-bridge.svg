<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="780" height="560" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="780" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="780" height="8" fill="url(#header)"/>
  <text x="390" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">s00 计算机基础 — 从硬件到应用，覆盖 15 个核心概念</text>

  <!-- ===== 左侧：硬件层 ===== -->
  <rect x="12" y="58" width="170" height="160" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="97" y="80" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">硬件层</text>
  <line x1="26" y1="88" x2="168" y2="88" stroke="#fecaca" stroke-width="1"/>

  <rect x="24" y="96" width="146" height="22" rx="4" fill="#fff" stroke="#f87171" stroke-width="1"/>
  <text x="97" y="111" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">1. CPU · 寄存器</text>

  <rect x="24" y="122" width="146" height="22" rx="4" fill="#fff" stroke="#f87171" stroke-width="1"/>
  <text x="97" y="137" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">2. 内存 (RAM)</text>

  <rect x="24" y="148" width="146" height="22" rx="4" fill="#fff" stroke="#f87171" stroke-width="1"/>
  <text x="97" y="163" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">3. 缓存 (Cache)</text>

  <rect x="24" y="174" width="146" height="22" rx="4" fill="#fff" stroke="#f87171" stroke-width="1"/>
  <text x="97" y="189" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">4. 磁盘 (SSD/HDD)</text>

  <!-- ===== 左侧：OS 层 ===== -->
  <rect x="12" y="226" width="170" height="248" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="97" y="248" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">操作系统层</text>
  <line x1="26" y1="256" x2="168" y2="256" stroke="#bfdbfe" stroke-width="1"/>

  <rect x="24" y="264" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="279" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">5. 虚拟内存</text>

  <rect x="24" y="290" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="305" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">6. 系统调用</text>

  <rect x="24" y="316" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="331" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">7. 进程</text>

  <rect x="24" y="342" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="357" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">8. 线程</text>

  <rect x="24" y="368" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="383" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">9. 协程</text>

  <rect x="24" y="394" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="409" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">10. 文件系统</text>

  <rect x="24" y="420" width="146" height="22" rx="4" fill="#fff" stroke="#60a5fa" stroke-width="1"/>
  <text x="97" y="435" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">11. Shell</text>

  <!-- ===== 左侧：应用层 ===== -->
  <rect x="12" y="482" width="170" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="97" y="504" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">应用 / 协议层</text>
  <line x1="26" y1="512" x2="168" y2="512" stroke="#bbf7d0" stroke-width="1"/>

  <rect x="24" y="518" width="65" height="22" rx="4" fill="#fff" stroke="#4ade80" stroke-width="1"/>
  <text x="56" y="533" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">12. JSON</text>

  <rect x="94" y="518" width="76" height="22" rx="4" fill="#fff" stroke="#4ade80" stroke-width="1"/>
  <text x="132" y="533" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">13. HTTP</text>

  <!-- ===== 右侧：s01-s20 章节映射 ===== -->
  <rect x="230" y="58" width="316" height="490" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="388" y="82" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">→ s01～s20 Agent Harness 章节 ←</text>
  <line x1="246" y1="92" x2="530" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- s01 -->
  <rect x="250" y="102" width="136" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="318" y="119" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">s01 Agent 循环</text>
  <text x="396" y="119" fill="#64748b" font-size="9">进程·系统调用·stdout/stderr</text>

  <!-- s02 -->
  <rect x="250" y="134" width="136" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="318" y="151" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">s02 工具调用</text>
  <text x="396" y="151" fill="#64748b" font-size="9">Shell·JSON Schema·并行(线程/协程)</text>

  <!-- s03 -->
  <rect x="250" y="166" width="136" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="318" y="183" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">s03 权限系统</text>
  <text x="396" y="183" fill="#64748b" font-size="9">文件路径·进程隔离</text>

  <!-- s04-s05 -->
  <rect x="250" y="198" width="136" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="318" y="215" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">s04-s05 钩子&amp;任务</text>
  <text x="396" y="215" fill="#64748b" font-size="9">事件驱动·DAG</text>

  <!-- s06-s08 -->
  <rect x="250" y="230" width="136" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="318" y="247" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">s06-s08 子代理·上下文</text>
  <text x="396" y="247" fill="#64748b" font-size="9">进程隔离·内存·Token</text>

  <!-- s09-s10 -->
  <rect x="250" y="262" width="136" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="318" y="279" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">s09-s10 记忆·提示词</text>
  <text x="396" y="279" fill="#64748b" font-size="9">磁盘I/O·flush·模板</text>

  <!-- s11 -->
  <rect x="250" y="294" width="136" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="318" y="311" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">s11 错误恢复</text>
  <text x="396" y="311" fill="#64748b" font-size="9">HTTP状态码·重试·退避</text>

  <!-- s12-s14 -->
  <rect x="250" y="326" width="136" height="26" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="318" y="343" fill="#9a3412" font-size="10" font-weight="600" text-anchor="middle">s12-s14 任务·调度</text>
  <text x="396" y="343" fill="#64748b" font-size="9">DAG·磁盘持久化·Cron·线程</text>

  <!-- s15-s17 -->
  <rect x="250" y="358" width="136" height="26" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="318" y="375" fill="#9a3412" font-size="10" font-weight="600" text-anchor="middle">s15-s17 Agent 团队</text>
  <text x="396" y="375" fill="#64748b" font-size="9">TCP/端口·协程·消息总线</text>

  <!-- s18 -->
  <rect x="250" y="390" width="136" height="26" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="318" y="407" fill="#9a3412" font-size="10" font-weight="600" text-anchor="middle">s18 工作树隔离</text>
  <text x="396" y="407" fill="#64748b" font-size="9">Git·文件系统·进程隔离</text>

  <!-- s19-s20 -->
  <rect x="250" y="422" width="136" height="26" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="318" y="439" fill="#9a3412" font-size="10" font-weight="600" text-anchor="middle">s19-s20 MCP&amp;综合</text>
  <text x="396" y="439" fill="#64748b" font-size="9">HTTP/SSE·WebSocket·stdio</text>

  <!-- 层级标签 -->
  <line x1="194" y1="138" x2="248" y2="119" stroke="#f87171" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="194" y1="331" x2="248" y2="119" stroke="#60a5fa" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="194" y1="453" x2="248" y2="375" stroke="#4ade80" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- 右侧详情框 -->
  <rect x="558" y="58" width="210" height="490" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="663" y="82" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">核心概念 × 所处层级</text>
  <line x1="574" y1="92" x2="752" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <text x="574" y="116" fill="#991b1b" font-size="9" font-weight="600">硬件层</text>
  <text x="574" y="134" fill="#475569" font-size="9">CPU 执行指令，寄存器存操作数</text>
  <text x="574" y="152" fill="#475569" font-size="9">内存存正在运行的程序和数据</text>
  <text x="574" y="170" fill="#475569" font-size="9">缓存桥接 CPU 与内存的速度差</text>
  <text x="574" y="188" fill="#475569" font-size="9">磁盘提供持久化，断电不丢失</text>

  <text x="574" y="216" fill="#1e40af" font-size="9" font-weight="600">操作系统层</text>
  <text x="574" y="234" fill="#475569" font-size="9">虚拟内存让每个程序独占地址空间</text>
  <text x="574" y="252" fill="#475569" font-size="9">系统调用是用户态→内核态的唯一入口</text>
  <text x="574" y="270" fill="#475569" font-size="9">进程 = fork+exec，线程共享内存</text>
  <text x="574" y="288" fill="#475569" font-size="9">协程在用户态协作式调度，比线程轻</text>
  <text x="574" y="306" fill="#475569" font-size="9">文件系统 = inode + 目录树 + fd</text>
  <text x="574" y="324" fill="#475569" font-size="9">Shell 解析命令，调度进程执行</text>

  <text x="574" y="352" fill="#166534" font-size="9" font-weight="600">应用 / 协议层</text>
  <text x="574" y="370" fill="#475569" font-size="9">JSON 六种类型，工具定义的通用语</text>
  <text x="574" y="388" fill="#475569" font-size="9">HTTP 请求/响应，状态码决定成败</text>
  <text x="574" y="406" fill="#475569" font-size="9">TCP 可靠传输，端口区分服务</text>
  <text x="574" y="424" fill="#475569" font-size="9">Git 版本快照，DAG 任务依赖</text>
  <text x="574" y="442" fill="#475569" font-size="9">Cron 定时触发，`0 9 * * 1`</text>

  <!-- 底部 -->
  <rect x="12" y="534" width="756" height="18" rx="4" fill="#f1f5f9"/>
  <text x="390" y="547" fill="#94a3b8" font-size="9" text-anchor="middle">左：s00 的 15 个概念（硬件 → OS → 应用）　中：对应的 s01～s20 Agent 章节　右：每个概念的核心要点</text>
</svg>
