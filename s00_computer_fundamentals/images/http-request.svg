<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="780" height="460" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="780" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="780" height="8" fill="url(#header)"/>
  <text x="390" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">HTTP 请求/响应 — 对讲机模型</text>

  <!-- 客户端 -->
  <rect x="40" y="72" width="160" height="50" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="94" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">客户端 (你)</text>
  <text x="120" y="112" fill="#64748b" font-size="10" text-anchor="middle">Python · 浏览器 · curl</text>

  <!-- 服务器 -->
  <rect x="580" y="72" width="160" height="50" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="94" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">服务器 (API)</text>
  <text x="660" y="112" fill="#64748b" font-size="10" text-anchor="middle">api.anthropic.com</text>

  <!-- 请求箭头 -->
  <line x1="200" y1="97" x2="578" y2="97" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="390" y="89" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">请求 Request</text>

  <!-- 请求详情框 -->
  <rect x="40" y="140" width="340" height="130" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="164" fill="#1e3a5f" font-size="12" font-weight="700">POST /v1/messages</text>
  <line x1="56" y1="174" x2="364" y2="174" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="196" fill="#64748b" font-size="10" font-family="monospace">Host: api.anthropic.com</text>
  <text x="60" y="214" fill="#64748b" font-size="10" font-family="monospace">Authorization: api-key xxx</text>
  <text x="60" y="232" fill="#64748b" font-size="10" font-family="monospace">Content-Type: application/json</text>
  <line x1="56" y1="240" x2="364" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="258" fill="#64748b" font-size="10" font-family="monospace">{"model":"...","messages":[...]}</text>
  <text x="346" y="258" fill="#94a3b8" font-size="9" text-anchor="end">← JSON Body</text>

  <!-- 响应箭头 -->
  <line x1="578" y1="300" x2="200" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="390" y="292" fill="#16a34a" font-size="11" font-weight="700" text-anchor="middle">响应 Response</text>

  <!-- 响应详情框 -->
  <rect x="400" y="320" width="340" height="120" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="420" y="344" fill="#166534" font-size="12" font-weight="700">200 OK</text>
  <line x1="416" y1="354" x2="724" y2="354" stroke="#e2e8f0" stroke-width="1"/>
  <text x="420" y="376" fill="#64748b" font-size="10" font-family="monospace">Content-Type: application/json</text>
  <line x1="416" y1="384" x2="724" y2="384" stroke="#e2e8f0" stroke-width="1"/>
  <text x="420" y="402" fill="#64748b" font-size="10" font-family="monospace">{"id":"msg_xxx","content":[...]}</text>
  <text x="706" y="402" fill="#94a3b8" font-size="9" text-anchor="end">← JSON Body</text>
  <text x="420" y="426" fill="#94a3b8" font-size="10">stop_reason: "tool_use" → Agent 继续循环</text>

  <!-- 状态码速查 -->
  <rect x="40" y="286" width="340" height="154" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="310" fill="#475569" font-size="12" font-weight="700">状态码速查</text>
  <line x1="56" y1="320" x2="364" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="342" fill="#16a34a" font-size="10" font-weight="600" font-family="monospace">200</text>
  <text x="100" y="342" fill="#475569" font-size="10">成功 — 这是你想要的</text>
  <text x="60" y="362" fill="#d97706" font-size="10" font-weight="600" font-family="monospace">400</text>
  <text x="100" y="362" fill="#475569" font-size="10">客户端错误 — 你发的东西不对</text>
  <text x="60" y="382" fill="#dc2626" font-size="10" font-weight="600" font-family="monospace">401</text>
  <text x="100" y="382" fill="#475569" font-size="10">未授权 — 没带钥匙(API Key)</text>
  <text x="60" y="402" fill="#d97706" font-size="10" font-weight="600" font-family="monospace">429</text>
  <text x="100" y="402" fill="#475569" font-size="10">限流 — 敲门太快，等一下重试</text>
  <text x="60" y="422" fill="#dc2626" font-size="10" font-weight="600" font-family="monospace">500</text>
  <text x="100" y="422" fill="#475569" font-size="10">服务器错误 — 隔壁工厂崩了</text>
</svg>
