<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">进程 I/O 模型 — stdin / stdout / stderr</text>

  <!-- 父进程 -->
  <rect x="40" y="72" width="140" height="60" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="98" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Shell / 父进程</text>
  <text x="110" y="118" fill="#64748b" font-size="10" text-anchor="middle">fork + exec</text>

  <!-- 箭头：父 → 子 -->
  <line x1="180" y1="102" x2="250" y2="102" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 子进程主框 -->
  <rect x="254" y="72" width="220" height="280" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="364" y="98" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">子进程 (PID: 12345)</text>
  <line x1="270" y1="108" x2="458" y2="108" stroke="#e2e8f0" stroke-width="1"/>

  <!-- stdin -->
  <rect x="274" y="120" width="180" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="364" y="138" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">stdin (fd 0) — 输入流</text>
  <text x="364" y="153" fill="#64748b" font-size="10" text-anchor="middle">键盘 · 文件 · 管道上游</text>

  <!-- stdout -->
  <rect x="274" y="170" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="364" y="188" fill="#166534" font-size="12" font-weight="600" text-anchor="middle">stdout (fd 1) — 输出流</text>
  <text x="364" y="203" fill="#64748b" font-size="10" text-anchor="middle">正常结果 · 打印到屏幕</text>

  <!-- stderr -->
  <rect x="274" y="220" width="180" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="364" y="238" fill="#991b1b" font-size="12" font-weight="600" text-anchor="middle">stderr (fd 2) — 错误流</text>
  <text x="364" y="253" fill="#64748b" font-size="10" text-anchor="middle">报错 · 警告 · 独立于 stdout</text>

  <!-- 环境变量 & CWD -->
  <rect x="274" y="272" width="180" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="292" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">环境变量 &amp; CWD</text>
  <text x="364" y="310" fill="#94a3b8" font-size="10" text-anchor="middle">env: 从父进程继承</text>
  <text x="364" y="326" fill="#94a3b8" font-size="10" text-anchor="middle">cwd: 当前工作目录</text>

  <!-- 右侧：退出码流向父进程 -->
  <line x1="474" y1="160" x2="544" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="510" y="152" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle">stdout</text>

  <line x1="474" y1="240" x2="544" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="510" y="232" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">stderr</text>

  <!-- 退出码节点 -->
  <rect x="548" y="170" width="140" height="100" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="618" y="196" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">退出码</text>
  <line x1="564" y1="206" x2="672" y2="206" stroke="#fed7aa" stroke-width="1"/>
  <text x="618" y="226" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">0 = 成功 ✓</text>
  <text x="618" y="250" fill="#991b1b" font-size="11" font-weight="600" text-anchor="middle">≠ 0 = 失败 ✗</text>

  <!-- 底部说明 -->
  <rect x="40" y="370" width="640" height="36" rx="6" fill="#f1f5f9"/>
  <text x="360" y="393" fill="#475569" font-size="11" text-anchor="middle">s01 里 subprocess.run() 同时捕获 stdout+stderr → 喂回模型；退出码告诉模型操作是否成功</text>
</svg>
