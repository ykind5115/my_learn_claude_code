<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="440" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">文件系统 — 目录树与路径</text>

  <!-- Unix 树 -->
  <rect x="30" y="68" width="28" height="28" rx="4" fill="#2563eb"/>
  <text x="44" y="87" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">/</text>
  <text x="68" y="87" fill="#475569" font-size="11">根目录 (root)</text>

  <!-- home -->
  <line x1="44" y1="96" x2="44" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="44" y1="112" x2="80" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="82" y="100" width="60" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="112" y="116" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">home</text>

  <!-- home/user -->
  <line x1="112" y1="124" x2="112" y2="138" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="112" y1="138" x2="150" y2="138" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="152" y="126" width="60" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="182" y="142" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">user</text>

  <!-- home/user/project -->
  <line x1="182" y1="150" x2="182" y2="164" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="182" y1="164" x2="218" y2="164" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="220" y="152" width="90" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="265" y="168" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">project</text>

  <!-- 子目录和文件 -->
  <line x1="265" y1="176" x2="265" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="190" x2="300" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="302" y="178" width="100" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="352" y="194" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">s01_agent_loop/</text>

  <line x1="265" y1="176" x2="265" y2="216" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="216" x2="300" y2="216" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="302" y="204" width="80" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="342" y="220" fill="#475569" font-size="10" text-anchor="middle">📄 code.py</text>

  <line x1="265" y1="176" x2="265" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="242" x2="300" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="302" y="230" width="85" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="246" fill="#475569" font-size="10" text-anchor="middle">📄 README.md</text>

  <!-- .env (隐藏文件) -->
  <line x1="265" y1="176" x2="265" y2="268" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="268" x2="300" y2="268" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="302" y="256" width="60" height="24" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="332" y="272" fill="#92400e" font-size="10" text-anchor="middle">.env</text>
  <text x="372" y="272" fill="#94a3b8" font-size="9">隐藏文件</text>

  <!-- 右侧：路径说明 -->
  <rect x="430" y="68" width="260" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="92" fill="#475569" font-size="12" font-weight="700">两种路径</text>
  <line x1="446" y1="100" x2="674" y2="100" stroke="#e2e8f0" stroke-width="1"/>

  <text x="450" y="122" fill="#2563eb" font-size="11" font-weight="600">绝对路径</text>
  <text x="450" y="140" fill="#475569" font-size="10" font-family="monospace">/home/user/project/s01/code.py</text>
  <text x="450" y="156" fill="#94a3b8" font-size="9">从根目录 / 开始，无论在哪都能找到</text>

  <text x="450" y="176" fill="#16a34a" font-size="11" font-weight="600">相对路径</text>
  <text x="450" y="194" fill="#475569" font-size="10" font-family="monospace">./code.py  ../s02/code.py</text>
  <text x="450" y="210" fill="#94a3b8" font-size="9">从当前目录 . 出发，.. 回到上级</text>

  <!-- 路径遍历攻击 -->
  <rect x="430" y="186" width="260" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="450" y="210" fill="#991b1b" font-size="11" font-weight="700">⚠ 路径遍历攻击</text>
  <text x="450" y="228" fill="#475569" font-size="10">恶意 prompt: "read ../../etc/passwd"</text>
  <text x="450" y="246" fill="#475569" font-size="10">通过 ../ 跳出项目目录访问系统文件</text>
  <text x="450" y="264" fill="#64748b" font-size="9">→ s03 权限系统负责拦截此类操作</text>

  <!-- 底部 CWD 说明 -->
  <rect x="30" y="296" width="280" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="50" y="320" fill="#166534" font-size="12" font-weight="700">CWD = 当前工作目录</text>
  <text x="50" y="340" fill="#475569" font-size="10">每个进程有一个 CWD。</text>
  <text x="50" y="356" fill="#475569" font-size="10">相对路径 . 和 .. 都基于 CWD 解释。</text>
  <text x="50" y="376" fill="#64748b" font-size="10">os.getcwd() = 你"现在"在哪个目录</text>

  <!-- Windows 提示 -->
  <rect x="336" y="296" width="354" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="356" y="320" fill="#475569" font-size="12" font-weight="700">Windows vs Unix</text>
  <text x="356" y="340" fill="#475569" font-size="10" font-family="monospace">Windows: C:\Users\me\project\code.py</text>
  <text x="356" y="356" fill="#475569" font-size="10" font-family="monospace">Unix:    /home/me/project/code.py</text>
  <text x="356" y="376" fill="#64748b" font-size="10">区别：盘符(C:) vs 根(/)、反斜杠 vs 正斜杠。但核心概念相同。</text>

  <!-- 底部图例 -->
  <rect x="30" y="386" width="660" height="36" rx="6" fill="#f1f5f9"/>
  <text x="360" y="408" fill="#475569" font-size="11" text-anchor="middle">🗁 目录  📄 文件  🔒 隐藏文件  → s02 的 read_file / write_file / glob 都在这个层级上操作</text>
</svg>
